<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>商圏カルテ 数字ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#15211c;--mute:#5b6b66;--line:#dfe7e5;--t:#0b7f86;--td:#053c40;--tl:#e2fbfb;--acc:#ff5a36;--y:#f2b705;--p:#8b6cf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif}
.w{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.02em}h1 small{display:block;font-size:.72rem;letter-spacing:.2em;color:var(--t);font-family:Inter;font-weight:700;margin-bottom:4px}
.meta{font-size:.8rem;color:var(--mute)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font:inherit;font-size:.82rem;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--td);color:#fff;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0 18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{font-size:.75rem;color:var(--mute);font-weight:700}.tile .v{font-family:Inter;font-weight:800;font-size:1.7rem;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:.72rem;color:var(--mute);margin-top:2px}.tile.hl{background:var(--td);border-color:var(--td);color:#fff}.tile.hl .k,.tile.hl .s{color:#bff3f4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:.95rem;font-weight:900}.card h2 span{font-weight:500;color:var(--mute);font-size:.78rem;margin-left:6px}
.cv{position:relative;height:250px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:#a4452f;background:#fdecea;border-radius:10px;padding:10px 12px;margin-top:14px}
#lock{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
#lock input{width:100%;font-size:1rem;padding:12px;border:1px solid #c4ccc5;border-radius:10px;margin:14px 0 10px}
#lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--td);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
#lock label{font-size:.8rem;color:var(--mute)}#err{color:#a4452f;font-size:.85rem;min-height:1.2em;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lock"><div style="font-family:Inter;font-weight:700;letter-spacing:.2em;color:var(--t);font-size:.75rem">SHOKEN KARTE</div>
  <h1 style="margin-top:6px">数字ボード</h1>
  <input id="pw" type="password" placeholder="鍵を入力" autocomplete="current-password">
  <label><input id="rem" type="checkbox" style="width:auto;margin:0 4px 0 0">この端末で覚える</label>
  <button id="open" style="margin-top:12px">開く</button><div id="err"></div></div>

<div class="w" id="app" hidden>
  <header><div><h1><small>SHOKEN KARTE ・ DASHBOARD</small>商圏カルテ 数字ボード</h1><div class="meta" id="meta"></div></div>
    <div class="seg" id="seg"><button data-d="7">7日</button><button data-d="30" class="on">30日</button><button data-d="90">90日</button></div></header>
  <div class="tiles" id="tiles"></div>
  <div class="grid">
    <div class="card"><h2>来訪者と無料申し込み<span>日ごと</span></h2><div class="cv"><canvas id="c1"></canvas></div></div>
    <div class="card"><h2>購入とサブスク<span>件数（棒）・売上（線）</span></h2><div class="cv"><canvas id="c2"></canvas></div></div>
    <div class="card"><h2>名刺QRの読み取り<span>申し込み・実物サンプル</span></h2><div class="cv"><canvas id="c3"></canvas></div></div>
    <div class="card"><h2>X（@shoken_karte）<span>いいね（棒）・フォロワー（線）</span></h2><div class="cv"><canvas id="c4"></canvas></div></div>
    <div class="card"><h2>無料申し込みの内訳<span>これまでの合計</span></h2><table id="t1"></table></div>
    <div class="card"><h2>どこから来たか<span>流入元・期間の合計</span></h2><table id="t2"></table></div>
  </div>
  <div id="notes"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass) {
  const enc = await (await fetch('data.enc.json?ts=' + Date.now())).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let K = null, X = null, D = 30; const charts = {};
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP'), num = n => Math.round(n || 0).toLocaleString('ja-JP');
function dates(n) { const out = []; const t = new Date(); for (let i = n - 1; i >= 0; i--) { const d = new Date(t.getTime() - i * 864e5); out.push(d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' })); } return out; }
const g = (o, d, f) => (o[d] && o[d][f]) || 0;
const sum = (ds, o, f) => ds.reduce((a, d) => a + g(o, d, f), 0);
function chart(id, cfg) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart($(id), cfg); }
const C = { t: '#0b7f86', td: '#053c40', acc: '#ff5a36', y: '#f2b705', p: '#8b6cf0', g: '#9fb3ae' };
Chart.defaults.font.family = '"Noto Sans JP",sans-serif'; Chart.defaults.color = '#5b6b66';
const axis = { grid: { color: '#edf2f1' }, ticks: { maxRotation: 0, autoSkipPadding: 14 } };

function render() {
  const ds = dates(D), lab = ds.map(d => d.slice(5).replace('-', '/'));
  const xd = {}; (X && X.days || []).forEach(r => xd[r.date] = r);
  const lastF = (() => { const r = (X && X.days || []).slice(-1)[0]; return r ? r.followers : null; })();
  const firstF = (() => { const r = (X && X.days || []).find(r => ds.includes(r.date)); return r ? r.followers : null; })();
  const tiles = [
    ['来訪者（ユーザー）', num(sum(ds, K.ga, 'users')), 'ページ表示 ' + num(sum(ds, K.ga, 'views')), 1],
    ['無料申し込み', num(sum(ds, K.apps, 'n')), 'うち法人 ' + num(sum(ds, K.apps, 'corp')) + '・送付済 ' + num(sum(ds, K.apps, 'sent'))],
    ['購入（単品）', num(sum(ds, K.stripe, 'lite') + sum(ds, K.stripe, 'full')), 'フル版 ' + num(sum(ds, K.stripe, 'full')) + '・簡易版 ' + num(sum(ds, K.stripe, 'lite'))],
    ['売上（入金）', yen(sum(ds, K.stripe, 'yen')), K.yenSource === 'checkout' ? 'Stripeの申し込み時の金額（入金の読み取り権限なし）' : 'Stripeに入金された額（毎月の引き落とし込み・返金を引く）', 1],
    ['サブスク（Stripeで支払い中）', num(K.subActive || 0), '期間の新規 ' + num(sum(ds, K.subs, 'start')) + '・解約 ' + num(sum(ds, K.subs, 'cancel')) + '（手入力の契約は数えない）'],
    ['名刺QRの読み取り', num(sum(ds, K.ga, 'qrFree') + sum(ds, K.ga, 'qrSample')), '申し込み ' + num(sum(ds, K.ga, 'qrFree')) + '・サンプル ' + num(sum(ds, K.ga, 'qrSample'))],
    ['商品ページの表示', num(sum(ds, K.ga, 'lp')), '/shoken-karte/'],
    ['Xフォロワー', lastF == null ? '—' : num(lastF), firstF != null && lastF != null ? '期間の増減 ' + (lastF - firstF >= 0 ? '+' : '') + (lastF - firstF) : '']
  ];
  $('#tiles').innerHTML = tiles.map(([k, v, s, hl]) => `<div class="tile${hl ? ' hl' : ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s || ''}</div></div>`).join('');

  chart('#c1', { data: { labels: lab, datasets: [
    { type: 'line', label: '来訪者', data: ds.map(d => g(K.ga, d, 'users')), borderColor: C.t, backgroundColor: 'rgba(11,127,134,.12)', fill: true, tension: .3, pointRadius: 0, yAxisID: 'y' },
    { type: 'bar', label: '無料申し込み', data: ds.map(d => g(K.apps, d, 'n')), backgroundColor: C.acc, borderRadius: 3, yAxisID: 'y2' }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: axis, y: { ...axis, beginAtZero: true, title: { display: true, text: '人' } }, y2: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { precision: 0 }, title: { display: true, text: '件' } } } } });
  chart('#c2', { data: { labels: lab, datasets: [
    { type: 'bar', label: 'フル版', data: ds.map(d => g(K.stripe, d, 'full')), backgroundColor: C.t, stack: 's' },
    { type: 'bar', label: '簡易版', data: ds.map(d => g(K.stripe, d, 'lite')), backgroundColor: '#7fd3d6', stack: 's' },
    { type: 'bar', label: 'サブスク契約', data: ds.map(d => g(K.stripe, d, 'sub')), backgroundColor: C.p, stack: 's' },
    { type: 'line', label: '売上（入金）', data: ds.map(d => g(K.stripe, d, 'yen')), borderColor: C.acc, pointRadius: 2, tension: .25, yAxisID: 'y2' }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { ...axis, stacked: true }, y: { ...axis, stacked: true, beginAtZero: true, ticks: { precision: 0 } }, y2: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { callback: v => yen(v) } } } } });
  chart('#c3', { type: 'bar', data: { labels: lab, datasets: [
    { label: 'お好きな住所で1回無料', data: ds.map(d => g(K.ga, d, 'qrFree')), backgroundColor: C.acc, borderRadius: 3 },
    { label: '実物サンプル', data: ds.map(d => g(K.ga, d, 'qrSample')), backgroundColor: C.t, borderRadius: 3 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: axis, y: { ...axis, beginAtZero: true, ticks: { precision: 0 } } } } });
  chart('#c4', { data: { labels: lab, datasets: [
    { type: 'bar', label: 'いいね', data: ds.map(d => xd[d] ? (xd[d].foryou || 0) + (xd[d].search || 0) + (xd[d].following || 0) : 0), backgroundColor: '#c9e9ea', borderRadius: 3, yAxisID: 'y' },
    { type: 'line', label: 'フォロワー', data: ds.map(d => xd[d] ? xd[d].followers : null), borderColor: C.td, spanGaps: true, pointRadius: 2, yAxisID: 'y2' }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: axis, y: { ...axis, beginAtZero: true }, y2: { position: 'right', grid: { display: false }, ticks: { precision: 0 } } } } });

  const st = Object.entries(K.appStatus || {}).sort((a, b) => b[1] - a[1]), kd = Object.entries(K.appKind || {});
  $('#t1').innerHTML = '<tr><th>状態</th><th class="n">件数</th></tr>' + st.map(([k, v]) => `<tr><td>${k || '（空）'}</td><td class="n">${num(v)}</td></tr>`).join('') +
    '<tr><th>区分</th><th class="n"></th></tr>' + kd.map(([k, v]) => `<tr><td>${k || '（空）'}</td><td class="n">${num(v)}</td></tr>`).join('');
  $('#t2').innerHTML = '<tr><th>流入元</th><th class="n">セッション</th></tr>' + (K.gaSources || []).map(([k, v]) => `<tr><td>${k}</td><td class="n">${num(v)}</td></tr>`).join('') || '<tr><td>まだデータがありません</td></tr>';
  $('#meta').textContent = '更新：' + new Date(K.generated).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) + '（1時間おきに自動更新）';
  $('#notes').innerHTML = (K.errors || []).length ? `<div class="note">取れなかった数字があります：${K.errors.join(' ／ ')}</div>` : '';
}
async function open(pass) {
  try { K = await decrypt(pass); } catch (e) { $('#err').textContent = '鍵が違います'; return false; }
  try { if ($('#rem').checked) localStorage.setItem('kpi_pw', pass); } catch (e) {}
  try { X = await (await fetch('../shoken/data.json?ts=' + Date.now())).json(); } catch (e) { X = null; }
  $('#lock').hidden = true; $('#app').hidden = false; render(); return true;
}
$('#open').onclick = () => open($('#pw').value);
$('#pw').onkeydown = e => { if (e.key === 'Enter') open($('#pw').value); };
$('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; D = +b.dataset.d; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); render(); };
try { const s = localStorage.getItem('kpi_pw'); if (s) { $('#rem').checked = true; open(s); } } catch (e) {}
</script>
</body>
</html>
